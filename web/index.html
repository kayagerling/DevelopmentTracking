<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <!-- Installeerbaar als app (ook "Zet op beginscherm" op iOS). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tracker" />
    <title>Development Tracker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230a84ff'/><rect x='7' y='9' width='18' height='3' rx='1.5' fill='white'/><rect x='7' y='15' width='12' height='3' rx='1.5' fill='white'/><rect x='7' y='21' width='6' height='3' rx='1.5' fill='white'/></svg>" />
    <script>
      // Thema direct toepassen om een witte flits te voorkomen.
      try {
        const t = localStorage.getItem("dt-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
