<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>DevelopmentTracker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230a84ff'/><rect x='7' y='9' width='18' height='3' rx='1.5' fill='white'/><rect x='7' y='15' width='12' height='3' rx='1.5' fill='white'/><rect x='7' y='21' width='6' height='3' rx='1.5' fill='white'/></svg>" />
    <script>
      // Thema direct toepassen om een witte flits te voorkomen.
      try {
        const t = localStorage.getItem("dt-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
